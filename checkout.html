<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Afrekenen — RetroVault</title>
<link rel="stylesheet" href="style.css">
<style>
  .cart-checkout-list{
    display:flex;
    flex-direction:column;
    gap:14px;
    margin:20px 0 28px;
  }
  .cart-checkout-item{
    display:flex;
    align-items:center;
    gap:14px;
    padding:14px;
    border:1px solid var(--border, #e5e5e5);
    border-radius:12px;
  }
  .cart-checkout-item .thumb{
    width:56px;
    height:56px;
    flex:0 0 56px;
    border-radius:8px;
    background:var(--surface-2, #f4f4f4);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:26px;
    overflow:hidden;
  }
  .cart-checkout-item .thumb img{
    width:100%;
    height:100%;
    object-fit:cover;
  }
  .cart-checkout-item .info{
    flex:1 1 auto;
    min-width:0;
  }
  .cart-checkout-item .info .name{
    font-weight:600;
    line-height:1.3;
  }
  .cart-checkout-item .info .meta{
    font-size:13px;
    color:var(--text-muted, #767676);
    margin-top:2px;
  }
  .cart-checkout-item .pay-btns{
    display:flex;
    flex-direction:column;
    gap:6px;
    flex:0 0 auto;
  }
  .pay-btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    padding:8px 16px;
    border-radius:24px;
    font-size:13px;
    font-weight:600;
    text-decoration:none;
    white-space:nowrap;
    border:1px solid transparent;
    cursor:pointer;
  }
  .pay-btn.paypal{
    background:#ffc439;
    color:#111;
  }
  .pay-btn.paypal:hover{ background:#ffb800; }
  .pay-btn.wero{
    background:#111;
    color:#fff;
  }
  .pay-btn.wero:hover{ background:#2b2b2b; }
  .checkout-summary{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:16px;
    border-radius:12px;
    background:var(--surface-2, #f4f4f4);
    font-weight:700;
    font-size:16px;
    margin-bottom:8px;
  }
  .checkout-note{
    font-size:13px;
    color:var(--text-muted, #767676);
    margin-bottom:20px;
  }
</style>
</head>
<body data-active="checkout">

<header class="site-header" id="site-header"></header>

<section class="section container" id="checkout-section">
  <!-- injected by JS -->
</section>

<footer class="site-footer" id="site-footer"></footer>

<script src="products.js"></script>
<script src="shop.js"></script>
<script src="layout.js"></script>
<script>
  function renderEmptyCheckout(){
    document.getElementById("checkout-section").innerHTML = `
      <div class="empty-state">
        <div class="glyph">🛒</div>
        <h3>Je winkelwagen is leeg</h3>
        <p>Voeg eerst producten toe voordat je kunt afrekenen.</p>
        <a href="producten.html" class="btn btn-primary">Bekijk producten</a>
      </div>
    `;
  }

  function renderCheckout(){
    const items = getCartItems();
    if(items.length === 0){
      renderEmptyCheckout();
      return;
    }

    const totals = computeTotals();

    const itemsHtml = items.map(({product, qty}) => {
      const thumb = product.image
        ? `<img src="${product.image}" alt="${product.name}">`
        : (product.glyph || "🎮");

      const paypalBtn = product.paypalId ? `
        <a class="pay-btn paypal" target="_blank" rel="noopener"
           href="https://www.paypal.com/ncp/payment/${product.paypalId}">
          Betaal met PayPal
        </a>
      ` : "";

      const weroBtn = product.weroUrl ? `
        <a class="pay-btn wero" target="_blank" rel="noopener"
           href="${product.weroUrl}">
          Betaal met Wero
        </a>
      ` : "";

      return `
        <div class="cart-checkout-item">
          <div class="thumb">${thumb}</div>
          <div class="info">
            <div class="name">${product.name}</div>
            <div class="meta">${qty} × ${formatPrice(product.price)} = ${formatPrice(product.price * qty)}</div>
          </div>
          <div class="pay-btns">
            ${paypalBtn}
            ${weroBtn}
          </div>
        </div>
      `;
    }).join("");

    document.getElementById("checkout-section").innerHTML = `
      <div class="eyebrow" style="margin-bottom:8px;">Afrekenen</div>
      <h1>Kies je betaalmethode per product</h1>
      <p class="checkout-note">Klik bij een product op PayPal of Wero om direct veilig af te rekenen. Je wordt naar de betaalpagina van de aanbieder gestuurd.</p>

      <div class="cart-checkout-list">
        ${itemsHtml}
      </div>

      <div class="checkout-summary">
        <span>Totaal (${items.reduce((s,i)=>s+i.qty,0)} artikel${items.reduce((s,i)=>s+i.qty,0)===1?"":"en"})</span>
        <span>${formatPrice(totals.subtotal)}</span>
      </div>
      <p class="checkout-note">Elk product wordt apart afgerekend via de gekozen betaalknop.</p>
      <p class="checkout-note" style="color:var(--phosphor, #2f8f56); font-weight:600;">Na betaling kunt u uw bezorggegevens invullen en uw kleur product kiezen.</p>
    `;
  }

  document.addEventListener("DOMContentLoaded", renderCheckout);
</script>
</body>
</html>
